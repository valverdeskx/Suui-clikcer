<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suui Clicker — Футбольный Кликер Онлайн</title>
    <meta name="description" content="Залипательный футбольный кликер в стиле SIUUU! Нажимай на мяч, зарабатывай монеты и качай автокликер до максимума!">
    <meta name="keywords" content="suui clicker, сиууу кликер, криштиану роналду игра, футбольный кликер, играть онлайн, автокликер, кликер с прокачкой">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <h1>🇵🇹 Suui Clicker</h1>
        
        <div class="score-container">
            <h2 id="coins-text">Монеты: 0 🪙</h2>
            <p id="cps-text">Автокликер: +0/сек ⚡</p>
        </div>

        <div class="click-zone">
            <button id="ball-button" onclick="clickBall()">⚽</button>
        </div>

        <h3>Магазин прокачки 🛒</h3>
        <div class="shop">
            <button class="shop-btn" id="upgrade-click-btn" onclick="buyUpgrade('click')">
                👟 Золотые Бутсы (+1 за клик)<br>
                <span class="price">Цена: 15 🪙</span>
            </button>

            <button class="shop-btn" id="upgrade-auto1-btn" onclick="buyUpgrade('auto1')">
                🧑‍ Топ-Тренер (+1 в сек)<br>
                <span class="price">Цена: 50 🪙</span>
            </button>

            <button class="shop-btn" id="upgrade-auto2-btn" onclick="buyUpgrade('auto2')">
                🏟️ Свой Стадион (+10 в сек)<br>
                <span class="price">Цена: 300 🪙</span>
            </button>
        </div>
    </div>

    <audio id="siuu-sound" src="https://www.myinstants.com/media/sounds/suiiiiiiiiiii.mp3" preload="auto"></audio>

    <!-- Встроенный скрипт, который Сафари точно увидит -->
    <script>
        let coins = 0;
        let coinsPerClick = 1;
        let coinsPerSecond = 0;

        let prices = {
            click: 15,
            auto1: 50,
            auto2: 300
        };

        function clickBall() {
            coins += coinsPerClick;
            updateUI();
            
            const sound = document.getElementById("siuu-sound");
            if (sound) {
                sound.currentTime = 0; 
                sound.play().catch(e => console.log("Звук ждет тапа"));
            }
        }

        function buyUpgrade(type) {
            if (coins >= prices[type]) {
                coins -= prices[type]; 
                
                if (type === 'click') {
                    coinsPerClick += 1; 
                    prices.click = Math.round(prices.click * 1.5); 
                } else if (type === 'auto1') {
                    coinsPerSecond += 1; 
                    prices.auto1 = Math.round(prices.auto1 * 1.5);
                } else if (type === 'auto2') {
                    coinsPerSecond += 10; 
                    prices.auto2 = Math.round(prices.auto2 * 1.6);
                }
                
                updateUI();
            } else {
                alert("Недостаточно монет! 🪙");
            }
        }

        function updateUI() {
            document.getElementById("coins-text").innerHTML = `Монеты: ${coins} 🪙`;
            document.getElementById("cps-text").innerHTML = `Автокликер: +${coinsPerSecond}/сек ⚡`;
            
            document.getElementById("upgrade-click-btn").querySelector(".price").innerHTML = `Цена: ${prices.click} 🪙`;
            document.getElementById("upgrade-auto1-btn").querySelector(".price").innerHTML = `Цена: ${prices.auto1} 🪙`;
            document.getElementById("upgrade-auto2-btn").querySelector(".price").innerHTML = `Цена: ${prices.auto2} 🪙`;
        }

        setInterval(function() {
            if (coinsPerSecond > 0) {
                coins += coinsPerSecond; 
                updateUI(); 
            }
        }, 1000);
    </script>
</body>
</html>
